{% extends "base.html" %}

{% block title %}Product Group (PG){% endblock %}

{% block head %}
<style>
    /* Override main constraints for full-screen iframe */
    main {
        padding: 0 !important;
        overflow: hidden !important;
    }
    
    main > div.pg-container {
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        height: calc(100vh - 60px);
        background: white;
    }
    
    .pg-iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
    }

    /* Hide the global floating chatbot button on this page */
    #chatbotFAB {
        display: none !important;
    }
</style>
{% endblock %}

{% block content %}
<div class="pg-container">
    <iframe src="https://pg-fne3c7deg9c8gkh8.uaenorth-01.azurewebsites.net/" 
            class="pg-iframe"
            title="Product Group">
    </iframe>
</div>
{% endblock %}
